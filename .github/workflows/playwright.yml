name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Playwright E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Node.js with cache
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Install Playwright browsers + dependencies
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Install PowerShell (optimized)
    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y powershell

    # Ensure PowerShell is accessible
    - name: Verify PowerShell Installation
      run: pwsh --version

    # Install X11 tools for clipboard & UI support
    - name: Install X11 tools
      run: sudo apt-get install -y xvfb xclip xsel

    # Run Playwright tests in headed mode using virtual display
    - name: Run Playwright Tests (Headed)
      run: |
        xvfb-run --auto-servernum -- \
        npx playwright test \
        --project=chromium \
        --workers=1 \
        --reporter=html

    # Upload Playwright HTML Report
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Upload test results (screenshots, videos, traces)
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
